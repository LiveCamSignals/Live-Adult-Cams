name: Update Live Models

on:
  schedule:
    # Every 5 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # allow manual run

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch models from BongaCams API
        run: |
          mkdir -p data
          # Try multiple hosts
          for host in bngprm.com promo-bc.com bngdyn.com tools.bongacams.com bngpst.com; do
            echo "Trying $host ..."
            if curl -sS --max-time 20 -A "Mozilla/5.0" \
              "https://$host/promo.php?c=18144&type=api&api_v=1&limit=100&api_type=json" \
              -o data/models.json; then
              # Validate JSON
              if python3 -c "import json; d=json.load(open('data/models.json')); assert isinstance(d,list) and len(d)>0; print(f'OK: {len(d)} models from $host')"; then
                echo "Success with $host"
                exit 0
              fi
            fi
            echo "Failed $host"
          done
          echo "All hosts failed"
          exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update live models $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
